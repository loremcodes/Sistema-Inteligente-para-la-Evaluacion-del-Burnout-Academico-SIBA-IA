<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar" class="z-50">

    <button id="mobile-sidebar-toggle"
            class="lg:hidden fixed bottom-5 right-5 z-50 bg-indigo-600 hover:bg-indigo-700 text-white p-3.5 rounded-full shadow-2xl focus:outline-none transition-transform active:scale-95"
            title="Abrir Menú">
        <svg id="toggle-icon-hamburger" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        <svg id="toggle-icon-close" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6 hidden">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-neutral-900/60 backdrop-blur-sm z-40 hidden lg:hidden transition-opacity"></div>

    <aside id="main-sidebar"
           class="fixed inset-y-0 left-0 w-64 h-full bg-neutral-800 text-white flex flex-col shadow-2xl transform -translate-x-full lg:translate-x-0 lg:static lg:h-screen transition-transform duration-300 ease-in-out z-40">

        <div class="px-6 py-6 border-b border-neutral-700/50 bg-neutral-800 flex-shrink-0">
            <h2 class="text-xl font-black tracking-wider text-indigo-400">SIBA-IA</h2>
            <p class="text-neutral-400 text-xs font-medium font-mono mt-1"
               th:text="${#authentication?.name ?: 'Administrador'}">
                Administrador
            </p>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto scrollbar-none">

            <a href="/admin/dashboard"
               class="flex items-center gap-3 px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-300 hover:text-white hover:bg-neutral-700/60 transition-all group">
                <span>Dashboard</span>
            </a>

            <a href="/admin/escuelas"
               class="flex items-center gap-3 px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-300 hover:text-white hover:bg-neutral-700/60 transition-all group">
                <span>Escuelas profesionales</span>
            </a>

            <a href="/admin/evaluaciones"
               class="flex items-center gap-3 px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-300 hover:text-white hover:bg-neutral-700/60 transition-all group">
                <span>Evaluaciones</span>
            </a>

            <a href="/admin/reportes"
               class="flex items-center gap-3 px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-300 hover:text-white hover:bg-neutral-700/60 transition-all group">
                <span>Reportes</span>
            </a>

            <a href="/admin/usuarios"
               class="flex items-center gap-3 px-4 py-2.5 rounded-xl font-medium text-sm text-neutral-300 hover:text-white hover:bg-neutral-700/60 transition-all group">
                <span>Usuarios</span>
            </a>

        </nav>

        <div class="px-6 py-4 border-t border-neutral-700/50 text-[10px] text-neutral-500 font-mono flex-shrink-0">
            SIBA-IA v1.0 • 2026
        </div>

    </aside>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleBtn = document.getElementById('mobile-sidebar-toggle');
            const sidebar = document.getElementById('main-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const iconHamburger = document.getElementById('toggle-icon-hamburger');
            const iconClose = document.getElementById('toggle-icon-close');

            function toggleSidebar() {
                const isOpen = !sidebar.classList.contains('-translate-x-full');

                if (isOpen) {
                    // Cierra el sidebar
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                    iconHamburger.classList.remove('hidden');
                    iconClose.classList.add('hidden');
                    toggleBtn.classList.remove('bg-neutral-700');
                    toggleBtn.classList.add('bg-indigo-600');
                } else {
                    // Abre el sidebar
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                    iconHamburger.classList.add('hidden');
                    iconClose.classList.remove('hidden');
                    toggleBtn.classList.remove('bg-indigo-600');
                    toggleBtn.classList.add('bg-neutral-700');
                }
            }

            toggleBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
        });
    </script>
</div>
</body>
</html>
