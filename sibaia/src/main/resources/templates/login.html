<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - SIBA-IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex flex-col justify-between min-h-screen relative">

<div class="absolute top-6 left-6 z-10">
    <a th:href="@{/}"
       class="inline-flex items-center gap-2 px-3 py-2 text-xs font-semibold text-slate-600 bg-white hover:bg-slate-100 hover:text-indigo-600 border border-slate-200 rounded-xl shadow-sm transition-all duration-200 group">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 transition-transform group-hover:-translate-x-1">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        <span>Volver al inicio</span>
    </a>
</div>
<div class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl border border-slate-100 shadow-sm p-8">
        <h1 class="text-2xl font-black text-center text-slate-800 tracking-tight mb-2">Iniciar Sesión SIBA-IA</h1>
        <p class="mb-6 text-slate-500 text-xs text-center">Docentes, tutores, psicólogos, orientadores y autoridades universitarias.</p>
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-[11px] text-slate-400 font-bold uppercase tracking-wider mb-1.5">Usuario</label>
                <input type="text" name="username" class="w-full text-xs px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-slate-700 transition-colors" required>
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 font-bold uppercase tracking-wider mb-1.5">Contraseña</label>
                <input type="password" name="password" class="w-full text-xs px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-slate-700 transition-colors" required>
            </div>
            <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2.5 rounded-lg text-xs transition-colors shadow-sm mt-2 cursor-pointer">Iniciar sesión</button>
            <p class="text-red-500 text-xs font-semibold text-center bg-red-50 p-2 rounded-lg border border-red-100" th:if="${param.error}">Usuario o contraseña incorrectos</p>
            <p class="text-emerald-600 text-xs font-semibold text-center bg-emerald-50 p-2 rounded-lg border border-emerald-100" th:if="${param.logout}">Sesión cerrada correctamente</p>
        </form>
    </div>
</div>
<footer class="w-full max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-center items-center text-[11px] text-slate-400 border-t border-slate-200/60 flex-shrink-0">
    <div> SIBA-IA © 2026 • Sistema Inteligente para la Evaluación del Burnout Académico</div>
</footer>
</body>
</html>
