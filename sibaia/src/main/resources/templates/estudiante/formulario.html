<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Estudiante | SIBA-IA</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-slate-50">
<header class="sticky top-0 z-40 bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <a th:href="@{/}" class="font-extrabold text-2xl text-slate-700">
            SIBA<span class="text-indigo-600">-IA</span>
        </a>
    </div>
</header>
<div class="relative overflow-hidden py-14">
    <div class="mx-auto mb-6 max-w-2xl px-6">
        <div class="mt-6 text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-800">
                Registro del Estudiante
            </h1>
            <p class="mt-4 mb-4 text-slate-500">
                Complete la siguiente información antes de iniciar el cuestionario.
            </p>
        </div>
        <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
            <form
                    th:action="@{/estudiante/guardar-temporal}"
                    th:object="${estudiante}"
                    method="post"
                    class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block mb-2 text-xs uppercase font-bold text-slate-500">
                            Nombres
                        </label>
                        <input
                                type="text"
                                th:field="*{nombres}"
                                required
                                class="w-full h-10 rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-indigo-300 outline-none">
                    </div>
                    <div>
                        <label class="block mb-2 text-xs uppercase font-bold text-slate-500">
                            Apellidos
                        </label>
                        <input
                                type="text"
                                th:field="*{apellidos}"
                                required
                                class="w-full h-10 rounded-xl border border-slate-300 px-4 py-3">
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block mb-2 text-xs uppercase font-bold text-slate-500">
                            Sexo
                        </label>
                        <select
                                th:field="*{sexo}"
                                required
                                class="w-full h-10 rounded-xl border border-slate-300 px-4 py-3">

                            <option value="">Seleccione...</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-2 text-xs uppercase font-bold text-slate-500">
                            Edad
                        </label>
                        <input
                                type="number"
                                min="15"
                                max="80"
                                th:field="*{edad}"
                                required
                                class="w-full h-10 rounded-xl border border-slate-300 px-4 py-3">
                    </div>
                </div>
                <div>
                    <label class="block mb-2 text-xs uppercase font-bold text-slate-500">
                        Escuela Profesional
                    </label>
                    <select
                            th:field="*{escuelaProfesional}"
                            class="w-full h-10 rounded-xl border border-slate-300 px-4 py-3" required>
                        <option value="">
                            Seleccione una carrera
                        </option>
                        <option
                                th:each="escuela : ${escuelas}"
                                th:value="${escuela.id}"
                                th:text="${escuela.nombre}">
                        </option>
                    </select>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block mb-2 text-xs uppercase font-bold text-slate-500">
                            Ciclo Académico
                        </label>
                        <select
                                th:field="*{cicloAcademico}"
                                class="w-full h-10 rounded-xl border border-slate-300 px-4 bg-white"
                                required>
                            <option value="">Seleccione un ciclo</option>
                            <option value="I">I</option>
                            <option value="II">II</option>
                            <option value="III">III</option>
                            <option value="IV">IV</option>
                            <option value="V">V</option>
                            <option value="VI">VI</option>
                            <option value="VII">VII</option>
                            <option value="VIII">VIII</option>
                            <option value="IX">IX</option>
                            <option value="X">X</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-2 text-xs uppercase font-bold text-slate-500">
                            Promedio Ponderado
                        </label>
                        <input
                                type="number"
                                step="0.01"
                                min="0"
                                max="20"
                                th:field="*{promedioPonderado}"
                                required
                                class="w-full h-10 rounded-xl border border-slate-300 px-4 py-3">
                    </div>
                </div>
                <div class="pt-5">
                    <button
                            type="submit"
                            class="w-full rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white py-4 font-bold transition">

                        Siguiente: Iniciar Cuestionario →
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<footer class="py-4 text-center text-sm text-slate-500">
    SIBA-IA © 2026 • Sistema Inteligente para la Evaluación del Burnout Académico
</footer>
</body>
</html>
